<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Coordination Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f172a;
      --bg-light: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #cbd5e1;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #8b5cf6;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --bg-light: #f1f5f9;
        --border: #cbd5e1;
        --text: #0f172a;
        --text-muted: #64748b;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .status-badge {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--blue);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .agent-card {
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .agent-card:hover {
      border-color: var(--blue);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
    }

    .agent-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .agent-name {
      font-size: 18px;
      font-weight: 600;
    }

    .agent-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-online {
      background: rgba(16, 185, 129, 0.1);
      color: var(--green);
    }

    .status-busy {
      background: rgba(245, 158, 11, 0.1);
      color: var(--amber);
    }

    .status-idle {
      background: rgba(100, 116, 139, 0.1);
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .task-info {
      background: rgba(59, 130, 246, 0.05);
      border-left: 3px solid var(--blue);
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .task-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .task-name {
      font-size: 14px;
      font-weight: 600;
      margin-top: 5px;
      color: var(--text);
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .stat-item {
      text-align: center;
    }

    .stat-num {
      font-size: 16px;
      font-weight: 700;
      color: var(--blue);
    }

    .stat-name {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .activities {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .activity {
      font-size: 12px;
      padding: 8px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      color: var(--text-muted);
    }

    .activity-time {
      color: var(--blue);
      font-weight: 600;
    }

    .busy-section {
      background: rgba(245, 158, 11, 0.05);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .busy-section h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--amber);
    }

    .busy-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .busy-agent-chip {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--amber);
    }

    .connection-status {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .connection-status.connected {
      background: rgba(16, 185, 129, 0.1);
      color: var(--green);
    }

    .connection-status.disconnected {
      background: rgba(239, 68, 68, 0.1);
      color: var(--red);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .dot.pulse {
      animation: pulse 2s infinite;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 Agent Coordination</h1>
      <div class="status-badge">
        <div class="stat">
          <div class="stat-value" id="total-agents">0</div>
          <div class="stat-label">Agents</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="busy-count">0</div>
          <div class="stat-label">Busy</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="total-revenue">$0</div>
          <div class="stat-label">Revenue</div>
        </div>
      </div>
    </header>

    <div id="busy-section" class="busy-section" style="display: none;">
      <h2>⚡ Currently Busy</h2>
      <div class="busy-list" id="busy-agents"></div>
    </div>

    <div class="grid" id="agents-grid"></div>
  </div>

  <div class="connection-status disconnected" id="connection-status">
    <div class="dot"></div>
    <span id="connection-text">Connecting...</span>
  </div>

  <script>
    const HUB_URL = 'ws://localhost:3010';
    let ws = null;
    let agentsState = new Map();

    function connect() {
      ws = new WebSocket(HUB_URL);

      ws.onopen = () => {
        console.log('✅ Connected to coordination hub');
        updateConnectionStatus(true);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };

      ws.onerror = (error) => {
        console.error('❌ WebSocket error:', error);
        updateConnectionStatus(false);
      };

      ws.onclose = () => {
        console.log('❌ Disconnected from hub');
        updateConnectionStatus(false);
        setTimeout(connect, 3000); // Reconnect after 3s
      };
    }

    function handleMessage(data) {
      if (data.type === 'initial_state') {
        data.agents.forEach(agent => agentsState.set(agent.id, agent));
        render();
      } else if (data.type === 'agent_updated') {
        agentsState.set(data.agent.id, data.agent);
        render();
      } else if (data.type === 'agents') {
        data.agents.forEach(agent => agentsState.set(agent.id, agent));
        render();
      } else if (data.type === 'busy_agents') {
        // Update busy status for all
        render();
      }
    }

    function render() {
      const agents = Array.from(agentsState.values());
      const busyAgents = agents.filter(a => a.is_busy);

      // Update stats
      document.getElementById('total-agents').textContent = agents.length;
      document.getElementById('busy-count').textContent = busyAgents.length;
      const totalRevenue = agents.reduce((sum, a) => sum + (a.stats?.total_revenue || 0), 0);
      document.getElementById('total-revenue').textContent = `$${totalRevenue.toLocaleString()}`;

      // Render busy section
      const busySection = document.getElementById('busy-section');
      const busyList = document.getElementById('busy-agents');
      if (busyAgents.length > 0) {
        busySection.style.display = 'block';
        busyList.innerHTML = busyAgents.map(a => `
          <div class="busy-agent-chip">
            ${a.name} · ${a.current_task || 'processing...'}
          </div>
        `).join('');
      } else {
        busySection.style.display = 'none';
      }

      // Render agent cards
      const grid = document.getElementById('agents-grid');
      grid.innerHTML = agents.map(agent => {
        const isBusy = agent.is_busy;
        const statusClass = isBusy ? 'status-busy' : 'status-online';
        const statusText = isBusy ? 'Busy' : 'Online';

        return `
          <div class="agent-card">
            <div class="agent-header">
              <div class="agent-name">${agent.name}</div>
              <div class="agent-status ${statusClass}">
                <div class="status-dot"></div>
                ${statusText}
              </div>
            </div>

            ${agent.current_task ? `
              <div class="task-info">
                <div class="task-label">Current Task</div>
                <div class="task-name">${agent.current_task}</div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${agent.progress || 0}%"></div>
                </div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 5px;">
                  ${agent.progress || 0}% complete
                </div>
              </div>
            ` : ''}

            <div class="stats">
              <div class="stat-item">
                <div class="stat-num">${agent.stats?.tasks_completed || 0}</div>
                <div class="stat-name">Tasks</div>
              </div>
              <div class="stat-item">
                <div class="stat-num">${agent.stats?.deals_closed || 0}</div>
                <div class="stat-name">Deals</div>
              </div>
              <div class="stat-item">
                <div class="stat-num">${agent.stats?.emails_sent || 0}</div>
                <div class="stat-name">Emails</div>
              </div>
              <div class="stat-item">
                <div class="stat-num">$${(agent.stats?.total_revenue || 0).toLocaleString()}</div>
                <div class="stat-name">Revenue</div>
              </div>
            </div>

            <div class="activities">
              <strong style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">
                Recent Activity
              </strong>
              ${(agent.activities || []).slice(-5).reverse().map(act => `
                <div class="activity">
                  <span class="activity-time">${new Date(act.timestamp).toLocaleTimeString()}</span>
                  · ${act.type}
                </div>
              `).join('') || '<div class="activity">No activity yet</div>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateConnectionStatus(connected) {
      const status = document.getElementById('connection-status');
      const text = document.getElementById('connection-text');
      const dot = status.querySelector('.dot');

      if (connected) {
        status.classList.remove('disconnected');
        status.classList.add('connected');
        text.textContent = 'Connected';
        dot.classList.add('pulse');
      } else {
        status.classList.remove('connected');
        status.classList.add('disconnected');
        text.textContent = 'Reconnecting...';
        dot.classList.remove('pulse');
      }
    }

    // Start
    connect();
  </script>
</body>
</html>
