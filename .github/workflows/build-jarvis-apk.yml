name: Build Jarvis APK

on:
  pull_request:
    paths:
      - ".github/workflows/build-jarvis-apk.yml"
  workflow_dispatch:
    inputs:
      jarvis_ref:
        description: "Branch, tag or commit of AbuZar-Ansarii/Jarvis to build (empty = default branch)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Jarvis (public, MIT)
        uses: actions/checkout@v4
        with:
          repository: AbuZar-Ansarii/Jarvis
          ref: ${{ inputs.jarvis_ref }}
          path: jarvis
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Current Flutter stable needs Gradle >= 9.3.1; Jarvis pins 9.1.0.
      - name: Bump Gradle wrapper to 9.3.1
        working-directory: jarvis
        run: |
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-9.3.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        working-directory: jarvis
        run: flutter pub get

      - name: Build release APK
        working-directory: jarvis
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: jarvis/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
