name: Build Jarvis APK

on:
  pull_request:
    paths:
      - ".github/workflows/build-jarvis-apk.yml"
      - "jarvis-tests/**"
  workflow_dispatch:
    inputs:
      jarvis_ref:
        description: "Branch, tag or commit of AbuZar-Ansarii/Jarvis to build (empty = default branch)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Proxy under test, pinned to a known meat-recovery commit.
  PROXY_URL: https://raw.githubusercontent.com/TumeloRamaphosa/meat-recovery/76f8be417c213e2728413d12c80e18e7011026bb/studex-jarvis-node/proxy/jarvis-llm-proxy.py

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Check out this repo (tests)
        uses: actions/checkout@v4
        with:
          path: studex

      - name: Check out Jarvis (public, MIT)
        uses: actions/checkout@v4
        with:
          repository: AbuZar-Ansarii/Jarvis
          ref: ${{ inputs.jarvis_ref }}
          path: jarvis
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 3.44.x (Jarvis's original toolchain) can no longer resolve its own
      # Kotlin build deps from the Gradle plugin portal, so build with 3.50.1 and
      # raise Jarvis's Gradle/AGP to the minimums that release requires.
      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - name: Bump Gradle to 9.3.1 and AGP to 9.1.1
        working-directory: jarvis/android
        run: |
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-9.3.1-all.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's#id("com.android.application") version "[0-9.]*"#id("com.android.application") version "9.1.1"#' settings.gradle.kts
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          grep 'com.android.application' settings.gradle.kts

      - name: Install dependencies
        working-directory: jarvis
        run: flutter pub get

      - name: Jarvis unit and widget tests
        working-directory: jarvis
        run: flutter test

      # Jarvis's real AiService -> StudEx jarvis-llm-proxy -> fake Ollama.
      - name: Jarvis -> StudEx proxy end-to-end test
        run: |
          cp studex/jarvis-tests/studex_proxy_e2e_test.dart jarvis/test/
          curl -fsSL -o jarvis-llm-proxy.py "$PROXY_URL"
          python3 studex/jarvis-tests/fake_ollama.py &
          BRIDGE_KEY=ci-e2e-key OLLAMA_BASE_URL=http://127.0.0.1:11999 \
            python3 jarvis-llm-proxy.py --listen 127.0.0.1 --port 18799 --upstream ollama &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:18799/health && break; sleep 1; done
          cd jarvis
          STUDEX_PROXY_URL=http://127.0.0.1:18799/v1 STUDEX_BRIDGE_KEY=ci-e2e-key \
            flutter test test/studex_proxy_e2e_test.dart
          rm test/studex_proxy_e2e_test.dart

      - name: Build release APK
        working-directory: jarvis
        run: flutter build apk --release

      - id: ver
        run: |
          echo "version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' jarvis/pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: jarvis/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jarvis-release-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and watch for crashes (Android 14 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash jarvis-tests/smoke.sh apk/app-release.apk smoke-out

      - name: Upload screenshot and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-smoke
          path: smoke-out
          retention-days: 14

  # A release asset is a plain public URL, so the phone installer can curl it
  # (workflow artifacts need a GitHub login). Only runs after tests + emulator pass.
  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-release-apk
          path: apk

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          tag="jarvis-v${VER}"
          cp apk/app-release.apk jarvis-release.apk
          sha256sum jarvis-release.apk | tee jarvis-release.apk.sha256
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" jarvis-release.apk jarvis-release.apk.sha256 --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" jarvis-release.apk jarvis-release.apk.sha256 -R "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" --title "Jarvis ${VER} (StudEx build)" \
              --notes "Built from AbuZar-Ansarii/Jarvis (MIT) by .github/workflows/build-jarvis-apk.yml."
          fi
          echo "APK URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/jarvis-release.apk"
