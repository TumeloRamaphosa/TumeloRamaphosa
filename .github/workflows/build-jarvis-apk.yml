name: Build Jarvis APK

on:
  pull_request:
    paths:
      - ".github/workflows/build-jarvis-apk.yml"
  workflow_dispatch:
    inputs:
      jarvis_ref:
        description: "Branch, tag or commit of AbuZar-Ansarii/Jarvis to build (empty = default branch)"
        required: false
        default: ""

permissions:
  contents: write  # publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Jarvis (public, MIT)
        uses: actions/checkout@v4
        with:
          repository: AbuZar-Ansarii/Jarvis
          ref: ${{ inputs.jarvis_ref }}
          path: jarvis
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 3.44.x (Jarvis's original toolchain) can no longer resolve its own
      # Kotlin build deps from the Gradle plugin portal, so build with 3.50.1 and
      # raise Jarvis's Gradle/AGP to the minimums that release requires.
      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - name: Bump Gradle to 9.3.1 and AGP to 9.1.1
        working-directory: jarvis/android
        run: |
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-9.3.1-all.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's#id("com.android.application") version "[0-9.]*"#id("com.android.application") version "9.1.1"#' settings.gradle.kts
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          grep 'com.android.application' settings.gradle.kts

      - name: Install dependencies
        working-directory: jarvis
        run: flutter pub get

      - name: Build release APK
        working-directory: jarvis
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: jarvis/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # A release asset is a plain public URL, so the phone installer can curl it
      # (workflow artifacts need a GitHub login). Re-runs replace the asset.
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ver=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' jarvis/pubspec.yaml)
          tag="jarvis-v${ver}"
          cp jarvis/build/app/outputs/flutter-apk/app-release.apk jarvis-release.apk
          sha256sum jarvis-release.apk | tee jarvis-release.apk.sha256
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" jarvis-release.apk jarvis-release.apk.sha256 --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" jarvis-release.apk jarvis-release.apk.sha256 -R "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" --title "Jarvis ${ver} (StudEx build)" \
              --notes "Built from AbuZar-Ansarii/Jarvis (MIT) by .github/workflows/build-jarvis-apk.yml."
          fi
          echo "APK URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/jarvis-release.apk"
