name: Build Jarvis APK

on:
  pull_request:
    paths:
      - ".github/workflows/build-jarvis-apk.yml"
  workflow_dispatch:
    inputs:
      jarvis_ref:
        description: "Branch, tag or commit of AbuZar-Ansarii/Jarvis to build (empty = default branch)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Jarvis (public, MIT)
        uses: actions/checkout@v4
        with:
          repository: AbuZar-Ansarii/Jarvis
          ref: ${{ inputs.jarvis_ref }}
          path: jarvis
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to the Flutter release Jarvis was built with (.metadata revision
      # 6b182d2c = 3.44.9); newer Flutter rejects its Gradle 9.1 / AGP 9.0.1.
      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        working-directory: jarvis
        run: flutter pub get

      - name: Build release APK
        working-directory: jarvis
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: jarvis/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
